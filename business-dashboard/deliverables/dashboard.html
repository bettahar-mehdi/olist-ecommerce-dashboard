    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0d0d1a; 
            color: #fff; 
            padding: 20px;
        }
        .header { 
            text-align: center; 
            padding: 30px 0; 
            border-bottom: 2px solid #00BFFF;
            margin-bottom: 30px;
        }
        .header h1 { color: #00BFFF; font-size: 28px; }
        .header p { color: #aaa; margin-top: 8px; }
        .kpi-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .kpi-box {
            background: #1a1a2e;
            border: 1px solid #00BFFF;
            border-radius: 8px;
            padding: 20px 30px;
            text-align: center;
            min-width: 200px;
        }
        .kpi-box .label { color: #aaa; font-size: 13px; }
        .kpi-box .value { color: #00BFFF; font-size: 24px; font-weight: bold; margin-top: 5px; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 10px;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 12px;
            margin-top: 30px;
            border-top: 1px solid #333;
        }
    </style>
